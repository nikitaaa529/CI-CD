name: Local CI-CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-source
          path: |
            app.py
            requirements.txt
            Dockerfile

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests and create JUnit report
        run: python -m pytest -v -junitxml=test-results.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: test-results.xml

  sast:
    name: SAST security scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config p/python --error /src

  deploy:
    name: Local Docker deploy
    runs-on: ubuntu-latest
    needs: [build, test, sast]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t local-file-manager:latest .
      - name: Run container
        run: |
          docker rm -f local-file-manager 2>/dev/null || true
          docker run -d --name local-file-manager \
            -p 8080:8080 local-file-manager:latest
      - name: Check application response
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:8080/; then exit 0; fi
            sleep 2
          done
          docker logs local-file-manager
          exit 1
